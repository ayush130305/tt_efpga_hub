# Tiny Tapeout project information
project:
  title:        "eFPGA + UART/SPI/I2C peripheral hub"
  author:       "Ayush Jain"
  discord:      ""
  description:  "Command-driven UART/SPI/I2C bridge next to a small scan-chain-configured LUT4 eFPGA with shift, divider and CRC hard blocks"
  language:     "Verilog"
  clock_hz:     25000000

  # 2x2 tiles, about 335 x 226 um
  tiles: "2x2"

  top_module:  "tt_um_ayush130305_efpga_hub"

  source_files:
    - "project.v"
    - "efpga_core.v"
    - "uart_rx.v"
    - "uart_tx.v"
    - "spi_master.v"
    - "i2c_master.v"
    - "dispatcher.v"

pinout:
  # Inputs
  ui[0]: "UART_RX (host to chip), also a fabric input"
  ui[1]: "SPI_MISO, also a fabric input"
  ui[2]: "fabric input"
  ui[3]: "fabric input"
  ui[4]: "fabric input"
  ui[5]: "fabric input"
  ui[6]: "fabric input"
  ui[7]: "fabric input"

  # Outputs
  uo[0]: "UART_TX (chip to host)"
  uo[1]: "fabric output 0 (or shift register bit 0)"
  uo[2]: "fabric output 1 (or shift register bit 1)"
  uo[3]: "fabric output 2 (or shift register bit 2)"
  uo[4]: "fabric output 3 (or shift register bit 3)"
  uo[5]: "fabric output 4 (or shift register bit 4)"
  uo[6]: "fabric output 5 (or shift register bit 5)"
  uo[7]: "fabric output 6 (or shift register bit 6)"

  # Bidirectional pins
  uio[0]: "CFG_DATA (config bit in)"
  uio[1]: "CFG_CLK (config shift clock in)"
  uio[2]: "CFG_OUT (config chain read-back out)"
  uio[3]: "SPI_MOSI"
  uio[4]: "SPI_SCLK"
  uio[5]: "SPI_CS_N"
  uio[6]: "I2C_SCL (open drain)"
  uio[7]: "I2C_SDA (open drain, bidirectional)"

# Do not change!
yaml_version: 6
